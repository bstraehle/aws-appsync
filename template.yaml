AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless GraphQL API using AWS AppSync and Amazon DynamoDB

Parameters:
  LogRetentionInDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
    Description: Number of days to retain AppSync logs
  FieldLogLevel:
    Type: String
    Default: ERROR
    AllowedValues: [NONE, ERROR, INFO, DEBUG, ALL]
    Description: AppSync field-level log level

Resources:
  DemoTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  DemoApi:
    Type: AWS::Serverless::GraphQLApi
    Properties:
      Name: !Sub ${AWS::StackName}-api
      SchemaUri: ./schema.graphql
      Auth:
        Type: API_KEY
      ApiKeys:
        # Expires 7 days after creation; see README for rotating it.
        DemoApiKey:
          Description: Demo API key
      Logging:
        CloudWatchLogsRoleArn: !GetAtt AppSyncLoggingRole.Arn
        FieldLogLevel: !Ref FieldLogLevel
        ExcludeVerboseContent: true
      XrayEnabled: true
      DataSources:
        DynamoDb:
          DemoTableDataSource:
            TableName: !Ref DemoTable
            TableArn: !GetAtt DemoTable.Arn
            Permissions: [Read, Write]
      Functions:
        getDemo:
          Runtime: {Name: APPSYNC_JS, Version: 1.0.0}
          DataSource: DemoTableDataSource
          CodeUri: ./resolvers/getDemo.js
        listDemos:
          Runtime: {Name: APPSYNC_JS, Version: 1.0.0}
          DataSource: DemoTableDataSource
          CodeUri: ./resolvers/listDemos.js
        createDemo:
          Runtime: {Name: APPSYNC_JS, Version: 1.0.0}
          DataSource: DemoTableDataSource
          CodeUri: ./resolvers/createDemo.js
        updateDemo:
          Runtime: {Name: APPSYNC_JS, Version: 1.0.0}
          DataSource: DemoTableDataSource
          CodeUri: ./resolvers/updateDemo.js
        deleteDemo:
          Runtime: {Name: APPSYNC_JS, Version: 1.0.0}
          DataSource: DemoTableDataSource
          CodeUri: ./resolvers/deleteDemo.js
      Resolvers:
        Query:
          getDemo:
            Runtime: {Name: APPSYNC_JS, Version: 1.0.0}
            Pipeline: [getDemo]
          listDemos:
            Runtime: {Name: APPSYNC_JS, Version: 1.0.0}
            Pipeline: [listDemos]
        Mutation:
          createDemo:
            Runtime: {Name: APPSYNC_JS, Version: 1.0.0}
            Pipeline: [createDemo]
          updateDemo:
            Runtime: {Name: APPSYNC_JS, Version: 1.0.0}
            Pipeline: [updateDemo]
          deleteDemo:
            Runtime: {Name: APPSYNC_JS, Version: 1.0.0}
            Pipeline: [deleteDemo]

  AppSyncLoggingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: appsync.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSAppSyncPushToCloudWatchLogs

  # AppSync writes to this group; creating it here sets the retention.
  DemoApiLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/appsync/apis/${DemoApi.ApiId}
      RetentionInDays: !Ref LogRetentionInDays

Outputs:
  GraphQLUrl:
    Description: GraphQL endpoint
    Value: !GetAtt DemoApi.GraphQLUrl
  ApiId:
    Description: AppSync API ID; get the API key with "aws appsync list-api-keys --api-id <ApiId>"
    Value: !GetAtt DemoApi.ApiId
  TableName:
    Description: DynamoDB table
    Value: !Ref DemoTable
