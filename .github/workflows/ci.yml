name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  resolvers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Flags JavaScript the AppSync APPSYNC_JS runtime doesn't support.
      - run: npm run lint

  template:
    runs-on: ubuntu-latest
    env:
      # The SAM transform needs a region (no credentials) for pseudo parameters.
      AWS_DEFAULT_REGION: us-west-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Lint the SAM template
        run: cfn-lint --regions us-west-2 -- template.yaml
      - name: Lint the transformed CloudFormation template
        # No .cfnlintrc.yaml exclusions here; W3002 only notes that local
        # CodeUri/SchemaUri paths need "sam deploy" or "sam package".
        run: |
          python scripts/transform.py template.yaml > transformed.json
          cfn-lint --regions us-west-2 --ignore-checks W3002 -- transformed.json
