schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type Demo {
  id: ID!
  name: String!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type DemoConnection {
  items: [Demo!]!
  nextToken: String
}

input CreateDemoInput {
  name: String!
}

input UpdateDemoInput {
  id: ID!
  name: String!
}

input DeleteDemoInput {
  id: ID!
}

input IDFilterInput {
  eq: ID
  ne: ID
  beginsWith: ID
}

input StringFilterInput {
  eq: String
  ne: String
  beginsWith: String
  contains: String
  notContains: String
}

input DemoFilterInput {
  id: IDFilterInput
  name: StringFilterInput
}

type Query {
  getDemo(id: ID!): Demo
  "Scans the table; limit defaults to 20 and is capped at 100."
  listDemos(filter: DemoFilterInput, limit: Int, nextToken: String): DemoConnection!
}

type Mutation {
  createDemo(input: CreateDemoInput!): Demo
  updateDemo(input: UpdateDemoInput!): Demo
  deleteDemo(input: DeleteDemoInput!): Demo
}

type Subscription {
  onCreateDemo(name: String): Demo @aws_subscribe(mutations: ["createDemo"])
  onUpdateDemo(id: ID, name: String): Demo @aws_subscribe(mutations: ["updateDemo"])
  onDeleteDemo(id: ID, name: String): Demo @aws_subscribe(mutations: ["deleteDemo"])
}
